[project]
name = "threatlens-api"
version = "0.1.0"
description = "ThreatLens defensive security intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "argon2-cffi==23.1.0",
  "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4", "ruff==0.8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

