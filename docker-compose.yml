services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatlens}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://threatlens:threatlens@db:5432/threatlens}
      MODEL_DIR: /models
      THREATLENS_DEMO_MODE: ${THREATLENS_DEMO_MODE:-true}
    volumes:
      - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${THREATLENS_DEMO_MODE:-true}
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
volumes:
  postgres-data:

